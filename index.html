                    ctx.strokeStyle = `rgba(255,255,255,${0.1 + 0.15 * energy})`;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // The circle the lower bob can reach. It glows as the bob nears it, which is when the pendulum nudges hardest
                    const stretch = Math.hypot(x2 - pivot.x, y2 - pivot.y) / (2 * length);
                    ctx.beginPath();
                    ctx.arc(pivot.x, pivot.y, circleRadius(), 0, 2 * Math.PI);
                    ctx.strokeStyle = `rgba(255,255,255,${0.2 + 0.6 * stretch ** 8})`;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(pivot.x, pivot.y);
                    ctx.lineTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = 'white';
                    ctx.stroke();

                    // Discs filled with the pads' background colour and outlined in white
                    const bobRadius = 0.15 * length;
                    for (const [x, y, r] of [[pivot.x, pivot.y, 3], [x1, y1, bobRadius], [x2, y2, bobRadius]]) {
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, 2 * Math.PI);
                        ctx.fillStyle = '#111';
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                // Just clear of the lower bob at full stretch
                function circleRadius() {
                    return 2.15 * length + 3;
                }

                // Anywhere inside the circle grabs it, like the firefly ring; the bobs never leave the circle, so that covers them too
                function isOver(e) {
                    return Math.hypot(e.clientX - pivot.x, e.clientY - pivot.y) < circleRadius() + 6;
                }

                // Capture phase, so grabbing the pendulum over a pad doesn't also move that pad
                addEventListener('pointerdown', e => {
                    if (e.button !== 0 || !isOver(e)) return;
                    e.stopPropagation();
                    e.preventDefault();
                    document.documentElement.setPointerCapture(e.pointerId);
                    grab = { id: e.pointerId, dx: target.x - e.clientX, dy: target.y - e.clientY, startX: e.clientX, startY: e.clientY, moved: false };
                    document.documentElement.classList.add('holding-pendulum');
                }, { capture: true });
                addEventListener('pointermove', e => {
                    if (grab && e.pointerId === grab.id) {
                        if (Math.hypot(e.clientX - grab.startX, e.clientY - grab.startY) > 3) grab.moved = true;
                        target.x = e.clientX + grab.dx;
                        target.y = e.clientY + grab.dy;
                    }
                    document.documentElement.classList.toggle('over-pendulum', !grab && isOver(e));
                });
                const release = e => {
                    if (!grab || e.pointerId !== grab.id) return;
                    // Wherever it was dropped is where it now belongs when the layout changes (a press that didn't move it leaves it as it was)
                    if (grab.moved) anchor = layout.anchorAt(target.x, target.y, noReach);
                    grab = null;
                    document.documentElement.classList.remove('holding-pendulum');
                };
                addEventListener('pointerup', release);
                addEventListener('pointercancel', release);

                return { update, draw };
            })();

            // Firefly ring, a second modulator. Seven fireflies circle a ring, each at its own pace, tugging on each other; they flash as
            // they pass the top. How hard they tug rises and falls like a tide, so about every 40 seconds they fall into step, flash
            // together, then drift apart again. A hand from the centre points to where the swarm is on average and lengthens as they fall
            // into step. A nearby pad's X and Y follow that hand by up to ±nudge: in step, the pad is pushed round in a steady circle;
            // out of step, it barely moves. Drag it like the pendulum; tap it to scatter them and let them find the beat again
            const fireflies = (() => {
                const count = 7;
                const ringSize = 0.15;       // ring radius, as a fraction of a pad's width
                const pace = 0.4;            // average laps per second
                const spread = 0.12;         // how far the fastest and slowest stray from that, laps per second
                const pullLow = 0.8;         // how hard they tug on each other at low tide, too weak to stay in step...
                const pullHigh = 1.4;        // ...and at high tide, strong enough to lock (it happens at about 1.1)
                const tide = 40;             // seconds from one high tide to the next
                const fullReach = 0.1;       // full effect within this many pad widths of a pad's centre...
                const noReach = 0.7;         // ...fading to none at this many
                const nudge = 0.3;           // furthest it can push a pad's X or Y either way, with them all in step
                const tapDistance = 5;       // pixels a press can move and still count as a tap
                const followRate = 10;       // how tightly the ring follows the pointer while dragged, per second (like the pendulum's pivot)
                const stepTime = 1 / 200;    // s

                const surface = floatingCanvas();

                let radius = ringSize * layout.padSize;
                // Starts at its home below the pads, left of the pendulum, out of reach of all of them
                let anchor = { home: true };
                const centre = home();
                const centreVelocity = { x: 0, y: 0 };
                const target = { x: centre.x, y: centre.y }; // where it's being dragged to; the centre glides after it
                let phases = scattered();
                // Paces spread evenly, so the group always has a fastest and a slowest that are hardest to keep in step
                const speeds = Array.from({ length: count }, (_, i) => 2 * Math.PI * (pace + spread * (2 * i / (count - 1) - 1)));
                let clock = 0;
                let hand = { x: 0, y: 0 };       // where the swarm is on average; its length is how in step they are (0 to 1)
                let grab = null;
                let last = null;
                let acc = 0;

                function scattered() {
                    return Array.from({ length: count }, () => Math.random() * 2 * Math.PI);
                }

                // With the pads in a row: below them, left of the pendulum, as it always started. In the 2 × 2 grid (phones held upright):
                // at the left of the space below the pads
                function home() {
                    if (layout.inARow) return { x: layout.width * 0.3, y: layout.height - 0.4 * layout.padSize };
                    return { x: layout.width * 0.2, y: layout.bandMiddle() };
                }

                function step(dt) {
                    // The centre springs toward where it's being dragged, without overshooting, the same way the pendulum's pivot does
                    for (const axis of ['x', 'y']) {
                        const accel = followRate * followRate * (target[axis] - centre[axis]) - 2 * followRate * centreVelocity[axis];
                        centreVelocity[axis] += accel * dt;
                        centre[axis] += centreVelocity[axis] * dt;
                    }

                    clock += dt;
                    const pull = pullLow + (pullHigh - pullLow) * (0.5 - 0.5 * Math.cos(2 * Math.PI * clock / tide));
                    // Each speeds up or slows down toward the others (the Kuramoto model of fireflies syncing)
                    phases = phases.map((phase, i) => {
                        let tug = 0;
                        for (const other of phases) tug += Math.sin(other - phase);
                        return (phase + (speeds[i] + pull * tug / count) * dt) % (2 * Math.PI);
                    });
                }

                // Positions go clockwise from the top of the ring
                const onRing = (phase, r) => ({ x: centre.x + r * Math.sin(phase), y: centre.y - r * Math.cos(phase) });

                // Brightest passing the top of the ring
                function flash(phase) {
                    const fromTop = Math.atan2(Math.sin(phase), Math.cos(phase));
                    return Math.exp(-((fromTop / 0.35) ** 2));
                }

                function update(now) {
                    radius = ringSize * layout.padSize;
                    // When the window resizes or the phone turns, it moves with whatever it's anchored to, straight there
                    if (layout.changed && !grab) {
                        const spot = layout.place(anchor, home);
                        target.x = centre.x = spot.x;
                        target.y = centre.y = spot.y;
                        centreVelocity.x = centreVelocity.y = 0;
                    }
                    target.x = Math.min(Math.max(target.x, 0), layout.width);
                    target.y = Math.min(Math.max(target.y, 0), layout.height);

                    if (last === null) last = now;
                    acc += Math.min(Math.max(now - last, 0), 100) / 1000;
                    last = now;
                    while (acc >= stepTime) {
                        step(stepTime);
                        acc -= stepTime;
                    }

                    hand = { x: 0, y: 0 };
                    for (const phase of phases) {
                        hand.x += Math.sin(phase) / count;
                        hand.y += Math.cos(phase) / count;
                    }

                    // What it feeds the pads: the hand, right and up being positive
                    const amounts = padReach(centre.x, centre.y, fullReach, noReach);
                    pads.forEach((pad, i) => { pad.mods.fireflies = { x: nudge * hand.x, y: nudge * hand.y, amount: amounts[i] }; });
                }

                function draw() {
                    // Big enough for the tide ring at its widest
                    const ctx = surface.begin(centre.x, centre.y, radius * 1.45 + 2);

                    // The tide: a faint outer ring that swells as their pull rises
                    const pull = 0.5 - 0.5 * Math.cos(2 * Math.PI * clock / tide);
                    ctx.setLineDash([2, 4]);
                    ctx.beginPath();
                    ctx.arc(centre.x, centre.y, radius * (1.3 + 0.15 * pull), 0, 2 * Math.PI);
                    ctx.strokeStyle = `rgba(255,255,255,${0.1 + 0.15 * pull})`;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // The ring lights up when they flash together
                    const inStep = Math.hypot(hand.x, hand.y);
                    const together = inStep * flash(Math.atan2(hand.x, hand.y));
                    ctx.beginPath();
                    ctx.arc(centre.x, centre.y, radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = `rgba(255,255,255,${0.2 + 0.7 * together})`;
                    ctx.stroke();

                    // The hand
                    ctx.beginPath();
                    ctx.moveTo(centre.x, centre.y);
                    ctx.lineTo(centre.x + radius * hand.x, centre.y - radius * hand.y);
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.stroke();

                    // Centre and fireflies: discs in the pads' background colour, the fireflies lighting up white as they flash
                    const discs = [[centre.x, centre.y, 3, 0], ...phases.map(phase => {
                        const { x, y } = onRing(phase, radius);
                        return [x, y, 0.13 * radius, flash(phase)];
                    })];
                    for (const [x, y, r, light] of discs) {
                        const level = Math.round(0x11 + (0xff - 0x11) * light);
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, 2 * Math.PI);
                        ctx.fillStyle = `rgb(${level},${level},${level})`;
                        ctx.fill();
                        ctx.strokeStyle = 'white';
                        ctx.stroke();
                    }
                }

                // Anywhere on the ring grabs it
                function isOver(e) {
                    return Math.hypot(e.clientX - centre.x, e.clientY - centre.y) < radius * 1.13 + 6;
                }

                // Capture phase, like the pendulum; if the pendulum already took this press, leave it
                addEventListener('pointerdown', e => {
                    if (e.button !== 0 || e.defaultPrevented || !isOver(e)) return;
                    e.stopPropagation();
                    e.preventDefault();
                    document.documentElement.setPointerCapture(e.pointerId);
                    grab = { id: e.pointerId, dx: target.x - e.clientX, dy: target.y - e.clientY, startX: e.clientX, startY: e.clientY, moved: false };
                    document.documentElement.classList.add('holding-fireflies');
                }, { capture: true });
                addEventListener('pointermove', e => {
                    if (grab && e.pointerId === grab.id) {
                        if (Math.hypot(e.clientX - grab.startX, e.clientY - grab.startY) > tapDistance) grab.moved = true;
                        if (grab.moved) {
                            target.x = e.clientX + grab.dx;
                            target.y = e.clientY + grab.dy;
                        }
                    }
                    document.documentElement.classList.toggle('over-fireflies', !grab && isOver(e));
                });
                const release = e => {
                    if (!grab || e.pointerId !== grab.id) return;
                    if (!grab.moved && e.type === 'pointerup') phases = scattered(); // a tap scatters them
                    // Wherever it was dropped is where it now belongs when the layout changes
                    if (grab.moved) anchor = layout.anchorAt(target.x, target.y, noReach);
                    grab = null;
                    document.documentElement.classList.remove('holding-fireflies');
                };
                addEventListener('pointerup', release);
                addEventListener('pointercancel', release);

                return { update, draw };
            })();

            // Scale, master volume and effect order, as three wordless sigils in the corner.
            // The key sigil is the scale the voices sing in, drawn on a twelve-point pitch clock: click for the next scale, or scroll either way.
            // The moon is the volume: drag it up to wax, down to wane, or scroll on it. Faint halos gather around it as it gets louder.
            // The flow sigil is the order of the vortex (delay and reverb, the little funnel) and the field (tape, the waves): click to
            // cycle vortex then field, side by side, field then vortex. Dots run along the thread the way the sound flows
            const sigils = (() => {
                const holder = document.createElement('div');
                holder.className = 'sigils';
                document.body.appendChild(holder);

                function makeSigil(className, label) {
                    const canvas = document.createElement('canvas');
                    canvas.className = `sigil ${className}`;
                    canvas.setAttribute('aria-label', label); // read out by screen readers; nothing shows on the page
                    holder.appendChild(canvas);
                    return { canvas, ctx: canvas.getContext('2d') };
                }

                const key = makeSigil('key', 'Scale');
                const moon = makeSigil('moon', 'Master volume');
                const flow = makeSigil('flow', 'Effect order');
                const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

                // Drag up or down, or scroll, to move a 0 to 1 setting. Dragging is relative to where it started, so a stray click never jumps it
                function verticalControl(canvas, get, set) {
                    let dragStart = null;
                    canvas.addEventListener('pointerdown', e => {
                        if (e.button !== 0) return;
                        canvas.setPointerCapture(e.pointerId);
                        dragStart = { y: e.clientY, value: get() };
                    });
                    canvas.addEventListener('pointermove', e => {
                        if (!dragStart || !canvas.hasPointerCapture(e.pointerId)) return;
                        const height = canvas.getBoundingClientRect().height;
                        set(clamp(dragStart.value + (dragStart.y - e.clientY) / (height * 2), 0, 1));
                    });
                    canvas.addEventListener('pointerup', () => { dragStart = null; });
                    canvas.addEventListener('wheel', e => {
                        e.preventDefault();
                        set(clamp(get() - e.deltaY * 0.0008, 0, 1));
                    }, { passive: false });
                }

                verticalControl(moon.canvas, () => masterVolume, value => { masterVolume = value; });

                // Scale: click for the next one, or scroll either way (a notch, or a trackpad swipe's worth, per scale)
                key.canvas.addEventListener('pointerdown', e => {
                    if (e.button !== 0) return;
                    scaleIndex = (scaleIndex + 1) % scales.length;
                });
                let scrolled = 0;
                key.canvas.addEventListener('wheel', e => {
                    e.preventDefault();
                    scrolled += e.deltaY;
                    while (Math.abs(scrolled) >= 100) {
                        const direction = Math.sign(scrolled);
                        scaleIndex = (scaleIndex + direction + scales.length) % scales.length;
                        scrolled -= direction * 100;
                    }
                }, { passive: false });

                flow.canvas.addEventListener('pointerdown', e => {
                    if (e.button !== 0) return;
                    routing = routings[(routings.indexOf(routing) + 1) % routings.length];
                    if (sound) sound.setRoute(routing);
                });

                // Where the two glyphs sit for each order, as fractions of the sigil; they glide between these
                const layouts = {
                    order: { vortex: [0.5, 0.33], field: [0.5, 0.67] },
                    parallel: { vortex: [0.27, 0.5], field: [0.73, 0.5] },
                    reverse: { vortex: [0.5, 0.67], field: [0.5, 0.33] },
                };
                const glyphs = { vortex: [...layouts[routing].vortex], field: [...layouts[routing].field] };
                const threadAlpha = { order: 0, parallel: 0, reverse: 0 };
                threadAlpha[routing] = 1;
                let last = null;

                function fit(sigil) {
                    const dpr = pixelRatio();
                    const size = sigil.canvas.clientWidth;
                    if (sigil.canvas.width !== Math.round(size * dpr)) {
                        sigil.canvas.width = sigil.canvas.height = Math.round(size * dpr);
                    }
                    sigil.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    sigil.ctx.clearRect(0, 0, size, size);
                    sigil.ctx.lineWidth = 1;
                    return size;
                }

                // The scale on a twelve-point pitch clock, root at the top. Its notes are joined into a shape, so every scale is its own
                // sigil, and a new one fades in over the old. Notes the voices are singing light up, with rays from the centre, as loud as they sing
                const shapeAlpha = scales.map((scale, i) => i === scaleIndex ? 1 : 0);
                let keyLast = null;

                function drawKey(now) {
                    const ctx = key.ctx;
                    const size = fit(key);
                    const cx = size / 2, cy = size / 2, r = size * 0.34;
                    const point = semitone => {
                        const angle = -Math.PI / 2 + semitone / 12 * 2 * Math.PI;
                        return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
                    };

                    const dt = keyLast === null ? 0 : Math.min(now - keyLast, 100);
                    keyLast = now;
                    const ease = 1 - Math.exp(-dt / 120);
                    scales.forEach((scale, i) => { shapeAlpha[i] += ((i === scaleIndex ? 1 : 0) - shapeAlpha[i]) * ease; });

                    // How loudly each of the twelve pitches is being sung right now
                    const sung = new Array(12).fill(0);
                    if (sound) {
                        for (const voice of sound.voices) {
                            const pitch = semitonesFor(voice.rank) % 12;
                            sung[pitch] = Math.max(sung[pitch], Math.min(voice.amp.gain.value / voiceLevel, 1));
                        }
                    }

                    // All twelve pitches as faint points, and rays to the ones being sung
                    for (let s = 0; s < 12; s++) {
                        const [x, y] = point(s);
                        ctx.beginPath();
                        ctx.arc(x, y, 1, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fill();
                        if (sung[s] > 0.02) {
                            ctx.beginPath();
                            ctx.moveTo(cx, cy);
                            ctx.lineTo(x, y);
                            ctx.strokeStyle = `rgba(255,255,255,${0.5 * sung[s]})`;
                            ctx.stroke();
                        }
                    }

                    scales.forEach((scale, i) => {
                        const alpha = shapeAlpha[i];
                        if (alpha < 0.01) return;
                        ctx.beginPath();
                        scale.forEach((s, k) => {
                            const [x, y] = point(s);
                            if (k === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        });
                        ctx.closePath();
                        ctx.strokeStyle = `rgba(255,255,255,${0.5 * alpha})`;
                        ctx.stroke();
                        // Its notes: discs in the pads' background colour, lighting up white as they're sung
                        for (const s of scale) {
                            const [x, y] = point(s);
                            const level = Math.round(0x11 + (0xff - 0x11) * (i === scaleIndex ? sung[s] : 0));
                            ctx.beginPath();
                            ctx.arc(x, y, size * 0.04, 0, 2 * Math.PI);
                            ctx.fillStyle = `rgba(${level},${level},${level},${alpha})`;
                            ctx.fill();
                            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                            ctx.stroke();
                        }
                    });

                    // A ring around the root, the one note every scale shares
                    const [rootX, rootY] = point(0);
                    ctx.beginPath();
                    ctx.arc(rootX, rootY, size * 0.07, 0, 2 * Math.PI);
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.stroke();
                }

                // A moon in the phase of the volume: new (just an outline) when silent, full when loudest. The lit part is hatched
                // with level lines like the field pad's
                function drawMoon() {
                    const ctx = moon.ctx;
                    const size = fit(moon);
                    const cx = size / 2, cy = size / 2, r = size * 0.3;

                    for (let k = 1; k <= 3; k++) {
                        const alpha = 0.25 * clamp(masterVolume * 3 - (k - 1), 0, 1);
                        if (alpha <= 0) continue;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r * (1 + 0.18 * k), 0, 2 * Math.PI);
                        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                        ctx.stroke();
                    }

                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.stroke();

                    // Lit part: the right edge, then back along the terminator, which sweeps from the right edge (new) to the left (full)
                    const terminator = 1 - 2 * masterVolume;
                    const steps = 48;
                    ctx.beginPath();
                    for (let s = 0; s <= steps; s++) {
                        const a = -Math.PI / 2 + Math.PI * s / steps;
                        ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                    }
                    for (let s = steps; s >= 0; s--) {
                        const a = -Math.PI / 2 + Math.PI * s / steps;
                        ctx.lineTo(cx + terminator * r * Math.cos(a), cy + r * Math.sin(a));
                    }
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.stroke();
                    ctx.save();
                    ctx.clip();
                    ctx.beginPath();
                    for (let y = cy - r; y <= cy + r; y += 3) {
                        ctx.moveTo(cx - r, y);
                        ctx.lineTo(cx + r, y);
                    }
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.stroke();
                    ctx.restore();
                }

                // The vortex pad in miniature: a few stacked rings narrowing downward
                function drawFunnel(ctx, x, y, size) {
                    for (let k = 0; k < 4; k++) {
                        const width = size * 0.13 * (1 - k * 0.22);
                        ctx.beginPath();
                        ctx.ellipse(x, y + (k - 1.5) * size * 0.035, width, width * 0.35, 0, 0, 2 * Math.PI);
                        ctx.strokeStyle = `rgba(255,255,255,${1 - k * 0.2})`;
                        ctx.stroke();
                    }
                }

                // The field pad in miniature: three slow waves that flatten toward their ends
                function drawWaves(ctx, x, y, size, now) {
                    ctx.beginPath();
                    for (let k = -1; k <= 1; k++) {
                        for (let s = 0; s <= 24; s++) {
                            const u = s / 24;
                            const px = x + (u - 0.5) * size * 0.26;
                            const py = y + k * size * 0.04 + Math.sin(Math.PI * u) * size * 0.015 * Math.sin(u * 9 + now / 600 + k * 1.7);
                            if (s === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                    }
                    ctx.strokeStyle = 'white';
                    ctx.stroke();
                }

                // The thread the sound follows for each order, as lines between points
                function threads(mode, size) {
                    const point = ([x, y]) => [x * size, y * size];
                    const top = ([x, y]) => [x * size, (y - 0.08) * size];
                    const bottom = ([x, y]) => [x * size, (y + 0.08) * size];
                    const entry = point([0.5, 0.06]), exit = point([0.5, 0.94]);
                    const { vortex, field } = glyphs;
                    if (mode === 'parallel') {
                        const split = point([0.5, 0.2]), join = point([0.5, 0.8]);
                        return [[entry, split, top(vortex)], [entry, split, top(field)], [bottom(vortex), join, exit], [bottom(field), join, exit]];
                    }
                    const [first, second] = mode === 'order' ? [vortex, field] : [field, vortex];
                    return [[entry, top(first)], [bottom(first), top(second)], [bottom(second), exit]];
                }

                // A point a given fraction of the way along a line of points
                function along(line, fraction) {
                    const lengths = line.slice(1).map((p, i) => Math.hypot(p[0] - line[i][0], p[1] - line[i][1]));
                    let remaining = fraction * lengths.reduce((a, b) => a + b, 0);
                    for (let i = 0; i < lengths.length; i++) {
                        if (remaining <= lengths[i] || i === lengths.length - 1) {
                            const t = lengths[i] > 0 ? Math.min(remaining / lengths[i], 1) : 0;
                            return [line[i][0] + (line[i + 1][0] - line[i][0]) * t, line[i][1] + (line[i + 1][1] - line[i][1]) * t];
                        }
                        remaining -= lengths[i];
                    }
                }

                function drawFlow(now) {
                    const ctx = flow.ctx;
                    const size = fit(flow);

                    // Glyphs glide to the current order's places; the old order's thread fades out as the new one fades in
                    const dt = last === null ? 0 : Math.min(now - last, 100);
                    last = now;
                    const ease = 1 - Math.exp(-dt / 120);
                    for (const name of ['vortex', 'field']) {
                        for (let axis = 0; axis < 2; axis++) glyphs[name][axis] += (layouts[routing][name][axis] - glyphs[name][axis]) * ease;
                    }
                    for (const mode of routings) threadAlpha[mode] += ((mode === routing ? 1 : 0) - threadAlpha[mode]) * ease;

                    const pulse = (now / 1000 * 0.6) % 1;
                    for (const mode of routings) {
                        const alpha = threadAlpha[mode];
                        if (alpha < 0.01) continue;
                        for (const line of threads(mode, size)) {
                            ctx.beginPath();
                            line.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
                            ctx.strokeStyle = `rgba(255,255,255,${0.45 * alpha})`;
                            ctx.stroke();
                            const [x, y] = along(line, pulse);
                            ctx.beginPath();
                            ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
                            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                            ctx.fill();
                        }
                    }

                    // Where the sound comes in and goes out
                    for (const y of [0.06, 0.94]) {
                        ctx.beginPath();
                        ctx.arc(size / 2, y * size, 2.5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#111';
                        ctx.fill();
                        ctx.strokeStyle = 'white';
                        ctx.stroke();
                    }

                    drawFunnel(ctx, glyphs.vortex[0] * size, glyphs.vortex[1] * size, size);
                    drawWaves(ctx, glyphs.field[0] * size, glyphs.field[1] * size, size, now);
                }

                return {
                    draw(now) {
                        drawKey(now);
                        drawMoon();
                        drawFlow(now);
                    }
                };
            })();

            let reported = false;
            function loop(now) {
                // Next frame first, so a frame that goes wrong can't stop the animation
                requestAnimationFrame(loop);
                // Nothing to draw into (a window squashed flat while being resized, say): wait for room, rather than feed zero sizes
                // into everything. The sims pick up where they left off, as if the time had been a pause
                if (!layout.measure()) return;
                try {
                    pendulum.update(now);
                    fireflies.update(now);
                    outlinePads();
                    for (const pad of pads) pad.render(now);
                    if (sound) sound.update(now);
                    pendulum.draw();
                    fireflies.draw();
                    sigils.draw(now);
                } catch (error) {
                    if (!reported) console.error(error); // once, rather than every frame
                    reported = true;
                }
            }
            requestAnimationFrame(loop);
        </script>
    </body>
</html>
